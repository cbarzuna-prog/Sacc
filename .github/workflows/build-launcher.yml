name: Build launcher APK

on:
  push:
    branches: [claude/sleepy-fermi-0pvf89]
    paths:
      - "launcher/**"
      - ".github/workflows/build-launcher.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug and release APKs
        run: ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease

      - name: List outputs and checksums
        run: |
          find app/build/outputs/apk -name '*.apk' -exec ls -l {} \;
          find app/build/outputs/apk -name '*.apk' -exec sha256sum {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: tvhome-launcher-apks
          path: launcher/app/build/outputs/apk/**/*.apk
          retention-days: 14
